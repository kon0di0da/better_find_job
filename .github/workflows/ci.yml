name: Blocking quality gates

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: better_find_job_test
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d better_find_job_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Check out tracked sources
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            apps/*/requirements-dev.txt
            migrations/requirements-dev.txt
            packages/contracts/ports/requirements-dev.txt
            packages/platform_adapters/pyproject.toml

      - name: Install repository-declared dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            -r apps/profile_service/requirements-dev.txt \
            -r apps/knowledge_service/requirements-dev.txt \
            -r apps/interview_service/requirements-dev.txt \
            -r packages/contracts/ports/requirements-dev.txt \
            -r migrations/requirements-dev.txt
          python -m pip install -e packages/platform_adapters

      # .ci/run_gate.py writes this schema for every gate:
      # gate: command: exit_code: started_at: finished_at:
      - name: Gate - lint
        run: |
          make lint REPORT_ROOT="${RUNNER_TEMP}/ci-artifacts"

      - name: Gate - unit
        if: success() || failure()
        run: |
          make unit REPORT_ROOT="${RUNNER_TEMP}/ci-artifacts"

      - name: Gate - spec-check
        if: success() || failure()
        run: |
          make spec-check REPORT_ROOT="${RUNNER_TEMP}/ci-artifacts"

      - name: Gate - mock-check
        if: success() || failure()
        run: |
          make mock-check REPORT_ROOT="${RUNNER_TEMP}/ci-artifacts"

      - name: Gate - contract-test
        if: success() || failure()
        run: |
          make contract-test REPORT_ROOT="${RUNNER_TEMP}/ci-artifacts"

      - name: Gate - fixture-test
        if: success() || failure()
        run: |
          make fixture-test REPORT_ROOT="${RUNNER_TEMP}/ci-artifacts"

      - name: Gate - migration-test
        if: success() || failure()
        env:
          ALLOW_DESTRUCTIVE_MIGRATION_TEST: "1"
          TEST_DATABASE_URL: postgresql://postgres@localhost:5432/better_find_job_test
        run: |
          make migration-test REPORT_ROOT="${RUNNER_TEMP}/ci-artifacts"

      - name: Gate - egress-scan
        if: success() || failure()
        run: |
          make egress-scan REPORT_ROOT="${RUNNER_TEMP}/ci-artifacts"

      - name: Upload gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blocking-quality-gate-evidence
          if-no-files-found: error
          retention-days: 14
          path: |
            ${{ runner.temp }}/ci-artifacts/logs/
            ${{ runner.temp }}/ci-artifacts/results/
            ${{ runner.temp }}/ci-artifacts/junit/
