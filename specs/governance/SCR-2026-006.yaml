changes:
  - 将已验收的 WP-FOUNDATION-006 状态调整为 DONE
  - 将 WP-FOUNDATION-007 状态从 BLOCKED 调整为 READY
  - 将 Makefile、.ci/**、.github/workflows/** 与 tests/ci/** 纳入 WP-FOUNDATION-007 输出和 path_allowlist
  - GitHub Actions workflow 固定为 .github/workflows/ci.yml，不调用远程 Codebase CI
  - lint、unit、spec-check、mock-check、contract-test、fixture-test、migration-test、egress-scan 均为 required gate，任一失败阻断
  - CI 使用 PostgreSQL 15+ service；migration-test 显式设置 ALLOW_DESTRUCTIVE_MIGRATION_TEST=1 与专用 TEST_DATABASE_URL
  - 出口扫描覆盖 git 跟踪文件中的常见 secret、私钥、真实邮箱和手机号，并精确排除显式合成测试标记误报
  - 出口扫描例外采用版本化精确规则，要求理由、责任人和到期时间，禁止静默或过宽绕过
  - tests/ci 使用运行时临时样本验证扫描正负例及 allowlist 有效和无效场景
  - 成功与失败均上传各 gate 日志、退出结果及 JUnit 或等价机器可读报告；禁止提交生成证据和凭证
security_privacy: >-
  CI 仅使用专用测试数据库与合成测试数据；出口扫描检查 git 跟踪文件中的凭证、私钥和真实联系信息。
  例外必须按规则、路径和值指纹精确匹配且可审计，过期或过宽例外失败，不得上传或提交凭证、数据库内容和生成证据。
